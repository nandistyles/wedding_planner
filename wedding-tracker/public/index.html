<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123d34">
<title>Wedding tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="cover">
  <div class="wrap">
    <div class="frame">
      <div>
        <h1 id="coupleNames">Wedding tracker</h1>
        <div class="sub" id="weddingLine"></div>
      </div>
      <div class="count hide" id="countBox"><b id="days"></b><span id="daysLabel"></span></div>
    </div>
    <div class="who hide" id="who">
      <span id="whoName"></span>
      <span class="links"><button type="button" id="switchWedding" class="hide">Switch wedding</button><button type="button" id="signOut">Sign out</button></span>
    </div>
  </div>
</header>

<main class="wrap" id="app"><p class="muted">Loading…</p></main>

<nav class="tabs hide" id="tabs" aria-label="Sections">
  <a href="#today"><span class="i" aria-hidden="true">🏠</span>Today</a>
  <a href="#checklist"><span class="i" aria-hidden="true">✅</span>Checklist</a>
  <a href="#meetings"><span class="i" aria-hidden="true">🗓️</span>Meetings</a>
  <a href="#food"><span class="i" aria-hidden="true">🍲</span>Food</a>
  <a href="#team"><span class="i" aria-hidden="true">👥</span>Team</a>
</nav>

<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>
<div id="printArea"></div>

<!-- config.js is written at build time from Vercel environment variables (see README) -->
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
