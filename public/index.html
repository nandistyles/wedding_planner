<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123d34">
<title>Wedding tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Laptop: sidebar with the couple, countdown and menu -->
<aside class="side" id="side" aria-label="Wedding menu">
  <div class="brand">
    <div class="names" id="coupleNames">Wedding tracker</div>
    <div class="when" id="weddingLine"></div>
    <div class="count hide" id="countBox"><b id="days"></b><span id="daysLabel"></span></div>
  </div>
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <div class="side-foot hide" id="who">
    <div id="whoName"></div>
    <div class="links"><button type="button" id="switchWedding" class="hide">Switch wedding</button><button type="button" id="signOut">Sign out</button></div>
  </div>
</aside>

<!-- Phone (and screens without a wedding open): compact top bar -->
<header class="topbar" id="topbar">
  <div class="tb-names" id="tbNames">Wedding tracker</div>
  <div class="tb-right"><span class="tb-count" id="tbCount"></span><button type="button" class="tb-link hide" id="tbSignOut">Sign out</button></div>
</header>

<main id="app"><p class="muted">Loading…</p></main>

<!-- Phone: bottom bar plus a "More" sheet -->
<nav class="bottom hide" id="bottom" aria-label="Sections"></nav>
<div class="more-sheet hide" id="moreSheet"><div class="more-panel" id="morePanel"></div></div>

<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>
<div id="printArea"></div>

<!-- config.js is written at build time from Vercel environment variables (see README) -->
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
